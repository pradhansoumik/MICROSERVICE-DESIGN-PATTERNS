server.port=8085
spring.application.name=api-gateway-auth-ratelimit

# Demo JWT (HS256) — NOT for production
app.jwt.secret=InterviewDemoSecretKey_ChangeMe_MustBeLongEnough_256bits!
app.jwt.expiration-minutes=60

# Rate limit demo: 5 requests / 60 seconds per authenticated user (JWT sub)
app.rate-limit.limit=5
app.rate-limit.window-seconds=60

# Same backends as basic api-gateway (COMMON services)
spring.cloud.gateway.routes[0].id=order-route
spring.cloud.gateway.routes[0].uri=http://localhost:8101
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/orders(?<segment>/?.*), /orders$\{segment}
spring.cloud.gateway.routes[0].filters[1]=AddRequestHeader=X-Gateway, api-gateway-auth-ratelimit

spring.cloud.gateway.routes[1].id=product-route
spring.cloud.gateway.routes[1].uri=http://localhost:8102
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/products/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/api/products(?<segment>/?.*), /products$\{segment}
spring.cloud.gateway.routes[1].filters[1]=AddRequestHeader=X-Gateway, api-gateway-auth-ratelimit

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.enabled=true
