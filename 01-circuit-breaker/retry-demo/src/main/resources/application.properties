server.port=8083
spring.application.name=retry-demo

# How many times the dummy API fails before succeeding (reset via /api/flaky/reset)
# Keep 2 for happy Retry demo (fail, fail, success)
demo.flaky.fail-times=2

# ---------- Resilience4j Retry (happy-path / business demos) ----------
resilience4j.retry.instances.flakyApi.maxAttempts=3
resilience4j.retry.instances.flakyApi.waitDuration=500ms
resilience4j.retry.instances.flakyApi.enableExponentialBackoff=true
resilience4j.retry.instances.flakyApi.exponentialBackoffMultiplier=2
resilience4j.retry.instances.flakyApi.retryExceptions[0]=com.interview.retry.TransientApiException

# ---------- Retry + Circuit Breaker combo (always-fail dependency) ----------
# Each HTTP call: Retry tries 3 times; each failed attempt is seen by CB.
# After enough failures → CB OPEN → next call fail-fast (no Payment-style hammering).
resilience4j.retry.instances.retryThenCb.maxAttempts=3
resilience4j.retry.instances.retryThenCb.waitDuration=300ms
resilience4j.retry.instances.retryThenCb.enableExponentialBackoff=true
resilience4j.retry.instances.retryThenCb.exponentialBackoffMultiplier=2
resilience4j.retry.instances.retryThenCb.retryExceptions[0]=com.interview.retry.TransientApiException

resilience4j.circuitbreaker.instances.retryThenCb.slidingWindowSize=6
resilience4j.circuitbreaker.instances.retryThenCb.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.retryThenCb.failureRateThreshold=50
resilience4j.circuitbreaker.instances.retryThenCb.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.retryThenCb.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.retryThenCb.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.retryThenCb.registerHealthIndicator=true

management.endpoints.web.exposure.include=health,info,retries,retryevents,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
